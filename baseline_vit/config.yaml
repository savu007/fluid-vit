# Paths are absolute, or relative to this YAML file (not the shell directory).
seed: 42
data:
  cache_dir: /global/homes/s/savu/data/hit-coarse-64
  channels: [u, v, w]
  train: [131, 132, 133, 134, 135, 136, 137, 138, 139, 140,
          141, 142, 143, 144, 145, 146, 147, 148, 149, 150]
  val: [152, 153, 154, 155]
  test: [157, 158, 159, 160]
  gaps: [151, 156]
  # One-step pairs require constant saved-time spacing. Infer it from train only.
  dt_rtol: 0.0001
  dt_atol: 0.0000000001

model:
  grid_size: 64
  in_channels: 3
  patch_size: 8
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4
  dropout: 0.0

training:
  output_dir: runs/baseline-01
  device: cuda
  epochs: 100
  batch_size: 2
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  # Full float32 initially; benchmark before introducing mixed precision.
  # For a tiny overfit diagnostic, set max_train_pairs: 4 and use a NEW output_dir.
  max_train_pairs: null
