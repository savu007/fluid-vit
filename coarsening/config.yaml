# Dataset and coarsening settings. Loaded by config.py.
# Absolute paths allow launching from any working directory.
root: /global/cfs/projectdirs/m5401/3D_HIT
file_glob: "fluid_*.nc"
# Matches the filename stem (without .nc); captures its integer file ID.
file_id_pattern: 'fluid_(\d+)'

# Names and sizes checked against fluid_25.nc metadata.
# Velocity components only; add P here if pressure should also be coarsened.
channels: [u, v, w]
var_dims: [time, x, y, z]
source_grid: [384, 384, 384]
snapshots_per_file: 10
# Physical assumption required by the Fourier method, not inferred from metadata.
periodic: true

coarsen:
  enabled: true
  method: spectral_sharp
  # Sharp Fourier low-pass; retained component modes are -31 through 31.
  # Coarse Nyquist planes are zeroed to avoid aliasing.
  target_grid: [64, 64, 64]
  cache_dir: /global/homes/s/savu/data/hit-coarse-64

# Timing subset: fluid_131.nc through fluid_160.nc, inclusive (30 files).
# train is used only for file selection here; this pass performs no training.
splits:
  train: [131, 132, 133, 134, 135, 136, 137, 138, 139, 140,
          141, 142, 143, 144, 145, 146, 147, 148, 149, 150,
          151, 152, 153, 154, 155, 156, 157, 158, 159, 160]
  gap_after_train: []
  val: []
  gap_after_val: []
  test: []
